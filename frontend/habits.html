<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HabitTrack — Мої звички</title>
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/habits.css" />
    <style>
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.8);
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff88;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00cc66;
    }
  </style>
  </head>

  <body>
    <header class="navbar glass">
      <div class="logo">HabitTrack</div>
      <nav class="nav-links">
        <a href="./main.html">Головна</a>
        <a href="./habits.html" class="active">Звички</a>
        <a href="./shop.html">Магазин</a>
        <a href="./stats.html">Статистика</a>
        <a href="./archive.html">Архів</a>
      </nav>
      <div class="auth-buttons" id="authButtons"></div>
    </header>

    <main class="section glass habits-section">
      <h1>Мої звички</h1>
      <p class="subtitle">
        Керуйте своїми звичками, відстежуйте прогрес і створюйте нові цілі для
        саморозвитку.
      </p>

      <button class="btn btn-fill" id="addHabitBtn">➕ Додати звичку</button>

      <div class="category-filter" style="display: none">
        <label>Категорія:</label>
        <select id="habitCategory">
          <option value="all">Усі</option>
          <option value="сон">Сон</option>
          <option value="спорт">Спорт</option>
          <option value="харчування">Харчування</option>
          <option value="інше">Інше</option>
        </select>
      </div>

      <div class="msg error" id="errorMsg" style="display: none;"></div>
      <div class="msg success" id="successMsg" style="display: none;"></div>

      <div class="habits-grid" id="habitsList"></div>
    </main>

    <div class="modal" id="habitModal">
      <div class="modal-content glass">
        <h2 id="modalTitle">Створити звичку</h2>
        <form id="habitForm">
          <input type="hidden" id="habitId" />

          <label>Назва звички:</label>
          <input
            type="text"
            id="habitName"
            required
            placeholder="Наприклад: Ранкова зарядка"
          />

          <label>Категорія:</label>
          <select id="habitType" required>
            <option value="сон">Сон</option>
            <option value="спорт">Спорт</option>
            <option value="харчування">Харчування</option>
            <option value="інше">Інше</option>
          </select>

          <label>Нотатка (опційно):</label>
          <textarea
            id="habitNote"
            placeholder="Додатківна інформація про звичку..."
            rows="3"
          ></textarea>

          <label>Ціль (кількість днів):</label>
          <input type="number" id="habitGoal" min="1" max="30" value="7" />

          <label class="complex-label">
            <input type="checkbox" id="isComplex" /> Складна звичка (кілька
            разів на день)
          </label>

          <div id="complexSettings" style="display: none">
            <label>Кількість виконань на день:</label>
            <input type="number" id="repeatCount" min="1" max="10" value="1" />
          </div>

          <div class="modal-buttons">
            <button type="submit" class="btn btn-fill">Зберегти</button>
            <button type="button" class="btn btn-outline" id="cancelBtn">
              Скасувати
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal" id="noteModal">
      <div class="modal-content glass">
        <h2>Нотатка до звички</h2>
        <p id="noteHabitName" style="font-weight:bold;"></p>
        <textarea
          id="noteText"
          rows="5"
          placeholder="Опиши свої думки, прогрес або настрій..."
        ></textarea>
        <div class="modal-buttons">
          <button class="btn btn-fill" id="saveNoteBtn">💾 Зберегти</button>
          <button class="btn btn-outline" id="cancelNoteBtn">Закрити</button>
        </div>
      </div>
    </div>

    <footer class="footer glass">
      <p>© 2025 HabitTrack. Усі права захищені.</p>
    </footer>

    <script src="./js/auth.js"></script>
    <script>
      // Перевірка автентифікації на входу
      if (!authService.isAuthenticated()) {
        window.location.href = 'login.html';
      }

      // Глобальні змінні
      let currentUser = null;
      let habits = [];
      const API_BASE = authService.apiBaseUrl;

      document.addEventListener("DOMContentLoaded", async () => {
        // Ініціалізуємо користувача
        currentUser = authService.getCurrentUser();
        
        // Завантажуємо звички
        await loadHabits();
        
        // Налаштовуємо evento слухачів
        setupEventListeners();
        
        // Відображаємо звички
        renderHabits();
        
        // Оновлюємо навігацію
        updateAuthButtons();
      });

      // Завантаження звичок з API
      async function loadHabits() {
        try {
          const response = await fetch(`${API_BASE}/habit/user/${currentUser.userId}`);
          if (!response.ok) throw new Error('Помилка завантаження звичок');
          habits = await response.json();
        } catch (error) {
          console.error('Помилка:', error);
          showError('Помилка завантаження звичок');
          habits = [];
        }
      }

      // Налаштування event слухачів
      function setupEventListeners() {
        const habitsList = document.getElementById("habitsList");
        const modal = document.getElementById("habitModal");
        const form = document.getElementById("habitForm");
        const addHabitBtn = document.getElementById("addHabitBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const categoryFilter = document.getElementById("habitCategory");
        const isComplexCheckbox = document.getElementById("isComplex");
        const complexSettings = document.getElementById("complexSettings");

        addHabitBtn.addEventListener("click", () => {
          form.reset();
          document.getElementById("habitId").value = "";
          document.getElementById("modalTitle").textContent = "Створити звичку";
          complexSettings.style.display = "none";
          modal.style.display = "flex";
        });

        cancelBtn.addEventListener("click", () => {
          modal.style.display = "none";
        });

        form.addEventListener("submit", handleFormSubmit);
        categoryFilter.addEventListener("change", renderHabits);

        // Показуємо/приховуємо складні налаштування
        isComplexCheckbox.addEventListener("change", () => {
          complexSettings.style.display = isComplexCheckbox.checked ? "block" : "none";
        });

        // Закриття модалю при клику на фон
        modal.addEventListener("click", (e) => {
          if (e.target === modal) {
            modal.style.display = "none";
          }
        });
      }

      // Обробка форми
      async function handleFormSubmit(e) {
        e.preventDefault();
        const form = e.target;
        const habitId = document.getElementById("habitId").value;
        const name = document.getElementById("habitName").value;
        const category = document.getElementById("habitType").value;
        const note = document.getElementById("habitNote")?.value || "";
        const isComplex = document.getElementById("isComplex").checked;
        const repeatCount = isComplex ? parseInt(document.getElementById("repeatCount").value) : 1;

        if (!name.trim()) {
          showError("Назва звички обов'язкова");
          return;
        }

        try {
          if (habitId) {
            // Оновлення звички
            const response = await fetch(`${API_BASE}/habit/${habitId}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                userId: currentUser.userId,
                name: name.trim(),
                category: category,
                note: note,
                repeatCount: repeatCount
              })
            });

            if (!response.ok) throw new Error('Помилка оновлення звички');
            showSuccess('Звичку оновлено успішно');
          } else {
            // Створення нової звички
            const response = await fetch(`${API_BASE}/habit`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                userId: currentUser.userId,
                name: name.trim(),
                category: category,
                note: note,
                repeatCount: repeatCount
              })
            });

            if (!response.ok) throw new Error('Помилка створення звички');
            showSuccess('Звичку створено успішно');
          }

          // Перезавантажуємо звички
          await loadHabits();
          renderHabits();
          document.getElementById("habitModal").style.display = "none";
        } catch (error) {
          console.error('Помилка:', error);
          showError(error.message);
        }
      }

      // Редагування звички
      window.editHabit = (habitId) => {
        const habit = habits.find(h => h.habitId === habitId);
        if (!habit) return;

        document.getElementById("habitId").value = habit.habitId;
        document.getElementById("habitName").value = habit.name;
        document.getElementById("habitType").value = habit.category;
        document.getElementById("habitNote").value = habit.note || "";
        document.getElementById("isComplex").checked = habit.repeatCount > 1;
        document.getElementById("repeatCount").value = habit.repeatCount || 1;
        
        // Показуємо/приховуємо complexSettings
        const complexSettings = document.getElementById("complexSettings");
        complexSettings.style.display = habit.repeatCount > 1 ? "block" : "none";
        
        document.getElementById("modalTitle").textContent = "Редагувати звичку";
        document.getElementById("habitModal").style.display = "flex";
      };

      // Видалення звички
      window.deleteHabit = async (habitId) => {
        if (!confirm("Видалити цю звичку?")) return;

        try {
          const response = await fetch(`${API_BASE}/habit/${habitId}?userId=${currentUser.userId}`, {
            method: 'DELETE'
          });

          if (!response.ok) throw new Error('Помилка видалення звички');
          
          showSuccess('Звичку видалено успішно');
          await loadHabits();
          renderHabits();
        } catch (error) {
          console.error('Помилка:', error);
          showError(error.message);
        }
      };

      // Архівування звички
      window.archiveHabit = async (habitId) => {
        if (!confirm("Архівувати цю звичку?")) return;

        try {
          const response = await fetch(`${API_BASE}/habit/${habitId}/archive?userId=${currentUser.userId}`, {
            method: 'POST'
          });

          if (!response.ok) throw new Error('Помилка архівування звички');
          
          showSuccess('Звичку архівовано успішно');
          await loadHabits();
          renderHabits();
        } catch (error) {
          console.error('Помилка:', error);
          showError(error.message);
        }
      };

      // Позначити звичку як виконану
      window.markDone = async (habitId) => {
        try {
          const response = await fetch(`${API_BASE}/habit/${habitId}/complete?userId=${currentUser.userId}`, {
            method: 'POST'
          });

          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.message || 'Помилка при позначенні');
          }

          const data = await response.json();
          showSuccess(`✅ Звичка виконана! Streak: ${data.streak} днів`);
          await loadHabits();
          renderHabits();
        } catch (error) {
          console.error('Помилка:', error);
          showError(error.message);
        }
      };

      // Відображення звичок
      function renderHabits() {
        const habitsList = document.getElementById("habitsList");
        const categoryFilter = document.getElementById("habitCategory").value;
        const categoryFilterBlock = document.querySelector(".category-filter");

        if (habits.length === 0) {
          habitsList.innerHTML = "<p>Поки що немає звичок. Додай першу!</p>";
          categoryFilterBlock.style.display = "none";
          return;
        }

        categoryFilterBlock.style.display = "flex";

        const filtered = categoryFilter === "all" 
          ? habits 
          : habits.filter(h => h.category === categoryFilter);

        habitsList.innerHTML = "";

        if (filtered.length === 0) {
          habitsList.innerHTML = "<p>Немає звичок в цій категорії.</p>";
          return;
        }

        filtered.forEach(habit => {
          const card = document.createElement("div");
          card.className = "habit-card glass";
          const repeatInfo = habit.repeatCount > 1 ? `<p>🔁 Повторень: ${habit.repeatCount} раз(и) на день</p>` : '';
          card.innerHTML = `
            <div class="habit-header">
              <h3>${habit.name}</h3>
              <div class="habit-actions">
                <button title="Редагувати" onclick="editHabit(${habit.habitId})">✏️</button>
                <button title="Архівувати" onclick="archiveHabit(${habit.habitId})">📦</button>
                <button title="Видалити" onclick="deleteHabit(${habit.habitId})">🗑️</button>
              </div>
            </div>
            <p>Категорія: ${habit.category}</p>
            <p>🔥 Streak: <b>${habit.streak}</b> днів</p>
            <p>Виконано: ${habit.completionCount} раз(и)</p>
            ${repeatInfo}
            ${habit.note ? `<p>📝 Нотатка: ${habit.note}</p>` : ''}
            <button class="btn btn-outline" onclick="markDone(${habit.habitId})">✅ Виконано сьогодні</button>
          `;
          habitsList.appendChild(card);
        });
      }

      // Оновлення навігації
      function updateAuthButtons() {
        const authButtons = document.getElementById("authButtons");
        authButtons.innerHTML = `
          <span class="user-greeting">Привіт, ${currentUser.username}!</span>
          <a href="./profile.html" class="btn btn-outline">Профіль</a>
          <button onclick="authService.logout()" class="btn btn-fill">Вийти</button>
        `;
      }

      // Утиліти для повідомлень
      function showError(message) {
        const errorDiv = document.getElementById("errorMsg");
        if (!errorDiv) return;
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
        setTimeout(() => {
          errorDiv.style.display = "none";
        }, 5000);
      }

      function showSuccess(message) {
        const successDiv = document.getElementById("successMsg");
        if (!successDiv) return;
        successDiv.textContent = message;
        successDiv.style.display = "block";
        setTimeout(() => {
          successDiv.style.display = "none";
        }, 3000);
      }
    </script>
  </body>
</html>
